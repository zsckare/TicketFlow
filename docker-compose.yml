services:
  events-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ticketflow_events
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    ports: ["5433:5432"]
    volumes: [events-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow -d ticketflow_events"]
      interval: 5s
      timeout: 5s
      retries: 10

  tickets-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ticketflow_tickets
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    ports: ["5434:5432"]
    volumes: [tickets-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow -d ticketflow_tickets"]
      interval: 5s
      timeout: 5s
      retries: 10

  orders-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ticketflow_orders
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    ports: ["5435:5432"]
    volumes: [orders-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow -d ticketflow_orders"]
      interval: 5s
      timeout: 5s
      retries: 10

  users-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ticketflow_users
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    ports: ["5436:5432"]
    volumes: [users-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow -d ticketflow_users"]
      interval: 5s
      timeout: 5s
      retries: 10

  payments-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ticketflow_payments
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    ports: ["5437:5432"]
    volumes: [payments-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow -d ticketflow_payments"]
      interval: 5s
      timeout: 5s
      retries: 10

  notifications-db:
    image: postgres:17
    environment:
      POSTGRES_DB: ticketflow_notifications
      POSTGRES_USER: ticketflow
      POSTGRES_PASSWORD: ticketflow
    ports: ["5438:5432"]
    volumes: [notifications-db-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ticketflow -d ticketflow_notifications"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]

  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:29092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

  events-service:
    build: ./services/events-service
    ports: ["8081:8081"]
    environment:
      DB_JDBC_URL: jdbc:postgresql://events-db:5432/ticketflow_events
      DB_USERNAME: ticketflow
      DB_PASSWORD: ticketflow
    depends_on:
      events-db:
        condition: service_healthy
    restart: unless-stopped

  tickets-service:
    build: ./services/tickets-service
    ports: ["8082:8082"]
    environment:
      DB_JDBC_URL: jdbc:postgresql://tickets-db:5432/ticketflow_tickets
      DB_USERNAME: ticketflow
      DB_PASSWORD: ticketflow
      EVENTS_SERVICE_URL: http://events-service:8081
    depends_on:
      tickets-db:
        condition: service_healthy
      events-service:
        condition: service_started
    restart: unless-stopped

  payments-service:
    build: ./services/payments-service
    ports: ["8085:8085"]
    environment:
      DB_JDBC_URL: jdbc:postgresql://payments-db:5432/ticketflow_payments
      DB_USERNAME: ticketflow
      DB_PASSWORD: ticketflow
    depends_on:
      payments-db:
        condition: service_healthy
    restart: unless-stopped

  users-service:
    build: ./services/users-service
    ports: ["8084:8084"]
    environment:
      DB_JDBC_URL: jdbc:postgresql://users-db:5432/ticketflow_users
      DB_USERNAME: ticketflow
      DB_PASSWORD: ticketflow
      JWT_SECRET: ticketflow-dev-secret-change-me
      JWT_ISSUER: ticketflow-users
      JWT_AUDIENCE: ticketflow-api
      JWT_EXPIRES_MINUTES: 60
    depends_on:
      users-db:
        condition: service_healthy
    restart: unless-stopped

  orders-service:
    build: ./services/orders-service
    ports: ["8083:8083"]
    environment:
      DB_JDBC_URL: jdbc:postgresql://orders-db:5432/ticketflow_orders
      DB_USERNAME: ticketflow
      DB_PASSWORD: ticketflow
      TICKETS_SERVICE_URL: http://tickets-service:8082
      PAYMENTS_SERVICE_URL: http://payments-service:8085
      EVENTS_SERVICE_URL: http://events-service:8081
      JWT_SECRET: ticketflow-dev-secret-change-me
      JWT_ISSUER: ticketflow-users
      JWT_AUDIENCE: ticketflow-api
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      OUTBOX_POLL_INTERVAL_MS: 1000
      OUTBOX_BATCH_SIZE: 50
    depends_on:
      orders-db:
        condition: service_healthy
      tickets-service:
        condition: service_started
      payments-service:
        condition: service_started
      events-service:
        condition: service_started
      kafka:
        condition: service_started
    restart: unless-stopped

  notifications-service:
    build: ./services/notifications-service
    ports: ["8086:8086"]
    environment:
      DB_JDBC_URL: jdbc:postgresql://notifications-db:5432/ticketflow_notifications
      DB_USERNAME: ticketflow
      DB_PASSWORD: ticketflow
      JWT_SECRET: ticketflow-dev-secret-change-me
      JWT_ISSUER: ticketflow-users
      JWT_AUDIENCE: ticketflow-api
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      KAFKA_GROUP_ID: ticketflow-notifications
      KAFKA_ORDER_CONFIRMED_TOPIC: ticketflow.orders.confirmed
    depends_on:
      notifications-db:
        condition: service_healthy
      kafka:
        condition: service_started
    restart: unless-stopped

  api-gateway:
    build: ./services/api-gateway
    ports: ["8080:8080"]
    environment:
      EVENTS_SERVICE_URL: http://events-service:8081
      TICKETS_SERVICE_URL: http://tickets-service:8082
      ORDERS_SERVICE_URL: http://orders-service:8083
      USERS_SERVICE_URL: http://users-service:8084
      PAYMENTS_SERVICE_URL: http://payments-service:8085
      NOTIFICATIONS_SERVICE_URL: http://notifications-service:8086
    depends_on:
      events-service:
        condition: service_started
      tickets-service:
        condition: service_started
      orders-service:
        condition: service_started
      users-service:
        condition: service_started
      payments-service:
        condition: service_started
      notifications-service:
        condition: service_started
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    volumes:
      - ./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:12.1.1
    ports: ["3000:3000"]
    depends_on: [prometheus]

volumes:
  events-db-data:
  tickets-db-data:
  orders-db-data:
  users-db-data:
  payments-db-data:
  notifications-db-data:
  redis-data:
