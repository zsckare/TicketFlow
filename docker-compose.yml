services:
  events-db:
    image: postgres:17
    environment: { POSTGRES_DB: ticketflow_events, POSTGRES_USER: ticketflow, POSTGRES_PASSWORD: ticketflow }
    ports: ["5433:5432"]
    volumes: [events-db-data:/var/lib/postgresql/data]
  tickets-db:
    image: postgres:17
    environment: { POSTGRES_DB: ticketflow_tickets, POSTGRES_USER: ticketflow, POSTGRES_PASSWORD: ticketflow }
    ports: ["5434:5432"]
    volumes: [tickets-db-data:/var/lib/postgresql/data]
  orders-db:
    image: postgres:17
    environment: { POSTGRES_DB: ticketflow_orders, POSTGRES_USER: ticketflow, POSTGRES_PASSWORD: ticketflow }
    ports: ["5435:5432"]
    volumes: [orders-db-data:/var/lib/postgresql/data]
  users-db:
    image: postgres:17
    environment: { POSTGRES_DB: ticketflow_users, POSTGRES_USER: ticketflow, POSTGRES_PASSWORD: ticketflow }
    ports: ["5436:5432"]
    volumes: [users-db-data:/var/lib/postgresql/data]
  payments-db:
    image: postgres:17
    environment: { POSTGRES_DB: ticketflow_payments, POSTGRES_USER: ticketflow, POSTGRES_PASSWORD: ticketflow }
    ports: ["5437:5432"]
    volumes: [payments-db-data:/var/lib/postgresql/data]
  notifications-db:
    image: postgres:17
    environment: { POSTGRES_DB: ticketflow_notifications, POSTGRES_USER: ticketflow, POSTGRES_PASSWORD: ticketflow }
    ports: ["5438:5432"]
    volumes: [notifications-db-data:/var/lib/postgresql/data]
  redis:
    image: redis:7.4-alpine
    ports: ["6379:6379"]
    volumes: [redis-data:/data]
  kafka:
    image: apache/kafka:4.1.0
    ports: ["9092:9092"]
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
  prometheus:
    image: prom/prometheus:v3.5.0
    ports: ["9090:9090"]
    volumes: [./infrastructure/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro]
  grafana:
    image: grafana/grafana:12.1.1
    ports: ["3000:3000"]
    depends_on: [prometheus]
volumes:
  events-db-data:
  tickets-db-data:
  orders-db-data:
  users-db-data:
  payments-db-data:
  notifications-db-data:
  redis-data:
