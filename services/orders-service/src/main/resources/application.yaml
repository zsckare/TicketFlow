ktor:
  deployment:
    port: 8083

  application:
    modules:
      - com.ticketflow.orders.SerializationKt.configureSerialization
      - com.ticketflow.orders.StatusPagesKt.configureStatusPages
      - com.ticketflow.orders.DatabaseKt.configureDatabase
      - com.ticketflow.orders.HttpClientsKt.configureHttpClients
      - com.ticketflow.orders.AuthenticationKt.configureAuthentication
      - com.ticketflow.orders.CorsKt.configureCors
      - com.ticketflow.orders.RoutingKt.configureRouting
      - com.ticketflow.orders.outbox.OutboxPublisherKt.configureOutboxPublisher

services:
  tickets:
    baseUrl: "$TICKETS_SERVICE_URL:http://localhost:8082"
  payments:
    baseUrl: "$PAYMENTS_SERVICE_URL:http://localhost:8085"

jwt:
  secret: "$JWT_SECRET:ticketflow-dev-secret-change-me"
  issuer: "$JWT_ISSUER:ticketflow-users"
  audience: "$JWT_AUDIENCE:ticketflow-api"

database:
  jdbcUrl: "$DB_JDBC_URL:jdbc:postgresql://localhost:5435/ticketflow_orders"
  username: "$DB_USERNAME:ticketflow"
  password: "$DB_PASSWORD:ticketflow"
  maximumPoolSize: "$DB_MAX_POOL_SIZE:10"
kafka:
  bootstrapServers: "$KAFKA_BOOTSTRAP_SERVERS:localhost:9092"
outbox:
  pollIntervalMs: "$OUTBOX_POLL_INTERVAL_MS:1000"
  batchSize: "$OUTBOX_BATCH_SIZE:50"
