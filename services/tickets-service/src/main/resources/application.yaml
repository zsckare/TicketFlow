ktor:
  deployment:
    port: 8082

  application:
    modules:
      - com.ticketflow.tickets.SerializationKt.configureSerialization
      - com.ticketflow.tickets.StatusPagesKt.configureStatusPages
      - com.ticketflow.tickets.DatabaseKt.configureDatabase
      - com.ticketflow.tickets.HttpClientsKt.configureHttpClients
      - com.ticketflow.tickets.RoutingKt.configureRouting

services:
  events:
    baseUrl: "$EVENTS_SERVICE_URL:http://localhost:8081"

database:
  jdbcUrl: "$DB_JDBC_URL:jdbc:postgresql://localhost:5434/ticketflow_tickets"
  username: "$DB_USERNAME:ticketflow"
  password: "$DB_PASSWORD:ticketflow"
  maximumPoolSize: "$DB_MAX_POOL_SIZE:10"