ktor:
  deployment:
    port: 8085
  application:
    modules:
      - com.ticketflow.payments.SerializationKt.configureSerialization
      - com.ticketflow.payments.StatusPagesKt.configureStatusPages
      - com.ticketflow.payments.DatabaseKt.configureDatabase
      - com.ticketflow.payments.RoutingKt.configureRouting
database:
  jdbcUrl: "$DB_JDBC_URL:jdbc:postgresql://localhost:5437/ticketflow_payments"
  username: "$DB_USERNAME:ticketflow"
  password: "$DB_PASSWORD:ticketflow"
  maximumPoolSize: "$DB_MAX_POOL_SIZE:10"
payments:
  provider: "$PAYMENT_PROVIDER:SIMULATED"
stripe:
  secretKey: "$STRIPE_SECRET_KEY:"
  webhookSecret: "$STRIPE_WEBHOOK_SECRET:"
services:
  orders:
    baseUrl: "$ORDERS_SERVICE_URL:http://localhost:8083"
    internalSecret: "$INTERNAL_SERVICE_SECRET:ticketflow-internal-dev-secret"
