ktor:
  deployment:
    port: 8081

  application:
    modules:
      - com.ticketflow.events.SerializationKt.configureSerialization
      - com.ticketflow.events.StatusPagesKt.configureStatusPages
      - com.ticketflow.events.DatabaseKt.configureDatabase
      - com.ticketflow.events.CorsKt.configureCors
      - com.ticketflow.events.RoutingKt.configureRouting

database:
  jdbcUrl: "$DB_JDBC_URL:jdbc:postgresql://localhost:5433/ticketflow_events"
  username: "$DB_USERNAME:ticketflow"
  password: "$DB_PASSWORD:ticketflow"
  maximumPoolSize: "$DB_MAX_POOL_SIZE:10"