ktor:
  deployment:
    port: 8086
  application:
    modules:
      - com.ticketflow.notifications.SerializationKt.configureSerialization
      - com.ticketflow.notifications.StatusPagesKt.configureStatusPages
      - com.ticketflow.notifications.AuthenticationKt.configureAuthentication
      - com.ticketflow.notifications.DatabaseKt.configureDatabase
      - com.ticketflow.notifications.RoutingKt.configureRouting
      - com.ticketflow.notifications.kafka.OrderConfirmedConsumerKt.configureOrderConfirmedConsumer
database:
  jdbcUrl: "$DB_JDBC_URL:jdbc:postgresql://localhost:5438/ticketflow_notifications"
  username: "$DB_USERNAME:ticketflow"
  password: "$DB_PASSWORD:ticketflow"
  maximumPoolSize: "$DB_MAX_POOL_SIZE:10"

kafka:
  bootstrapServers: "$KAFKA_BOOTSTRAP_SERVERS:localhost:9092"
  groupId: "$KAFKA_GROUP_ID:ticketflow-notifications"
  orderConfirmedTopic: "$KAFKA_ORDER_CONFIRMED_TOPIC:ticketflow.orders.confirmed"

jwt:
  secret: "$JWT_SECRET:ticketflow-dev-secret-change-me"
  issuer: "$JWT_ISSUER:ticketflow-users"
  audience: "$JWT_AUDIENCE:ticketflow-api"

mail:
  host: "$SMTP_HOST:localhost"
  port: "$SMTP_PORT:1025"
  from: "$MAIL_FROM:tickets@ticketflow.local"
